name: Validate master data

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate manifest checksums
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON and checksums
        run: python scripts/validate_manifest.py

      - name: Validate evaluation and engagement contracts
        run: python scripts/validate_training_evaluation.py

      - name: Test evaluation behavior
        run: python scripts/test_training_evaluation.py
